<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>review_bot</title>
<style>
:root {
  --paper: #F1F3EE;
  --sheet: #FBFCF9;
  --ink: #1E2622;
  --ink-soft: #55605A;
  --rule: #D6DBD2;
  --marker: #F4D35E;
  --marker-soft: #F8E7A3;
  --ok: #2F7A55;
  --bad: #A8343F;
  --bad-soft: #F6E3E3;
  --test: #8A5A0F;
  --on-marker: #1E2622;
  --font: "Apple SD Gothic Neo", "Pretendard", -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
  --serif: "Iowan Old Style", "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #161B18; --sheet: #1D2420; --ink: #E4E9E4; --ink-soft: #9FAAA3; --rule: #2F3833;
    --marker: #C9A93A; --marker-soft: #5A4C1C; --ok: #5DB88A; --bad: #E88A93; --bad-soft: #3A2226; --test: #E0AE5A;
  }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.6 var(--font); font-variant-numeric: tabular-nums; }
a { color: inherit; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.9em; background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--paper); padding: 6px 12px; border-radius: 6px; z-index: 30; }
.skip:focus { left: 8px; }

/* ── 상단 막대: 탭과 "지금 상태" 를 모든 화면에서 보여 준다 ── */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--ink); }
.top-in { max-width: 1040px; margin: 0 auto; padding: 0 24px; display: flex; align-items: stretch; gap: 8px 24px; flex-wrap: wrap; }
.brand { font: 800 19px/1 var(--serif); letter-spacing: -0.01em; margin: 0; padding: 16px 0; display: flex; align-items: center; }
nav { display: flex; gap: 2px; flex: 1; min-width: 0; }
nav button { background: none; border: 0; padding: 0 14px; min-height: 48px; cursor: pointer; font-size: 15px; color: var(--ink-soft); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav button:hover { color: var(--ink); }
nav button[aria-current="page"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--marker); }
.count { display: inline-block; min-width: 20px; text-align: center; font-size: 12px; font-weight: 700; background: var(--marker); color: var(--on-marker); border-radius: 10px; padding: 0 6px; margin-left: 4px; line-height: 20px; }
.count:empty { display: none; }
.pill { align-self: center; font-size: 13px; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 4px 12px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pill:hover { border-color: var(--ink); }

main { max-width: 1040px; margin: 0 auto; padding: 28px 24px 120px; }
main:focus { outline: none; }
h1 { font: 700 28px/1.25 var(--serif); letter-spacing: -0.01em; margin: 0 0 6px; }
h2 { font-size: 17px; margin: 36px 0 12px; display: flex; align-items: baseline; gap: 8px; }
h2 .sub { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
h3 { font-size: 15px; margin: 20px 0 8px; }
.lede { color: var(--ink-soft); margin: 0 0 20px; max-width: 70ch; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }

.btn { border: 1px solid var(--ink); background: var(--sheet); padding: 6px 14px; min-height: 36px; border-radius: 6px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.ghost { border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0; }

/* ── 시작하기 ── */
.onboard { border: 2px solid var(--ink); border-radius: 10px; padding: 20px 24px; margin: 0 0 28px; background: var(--sheet); }
.onboard h2 { margin: 0 0 4px; font: 700 20px/1.3 var(--serif); }
.steps { list-style: none; padding: 0; margin: 14px 0 0; counter-reset: step; }
.steps > li { counter-increment: step; display: grid; grid-template-columns: 32px 1fr; gap: 0 12px; padding: 14px 0; border-top: 1px dotted var(--rule); }
.steps > li::before { content: counter(step); width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.steps > li.done::before { content: "✓"; background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.steps > li.now::before { background: var(--marker); color: var(--on-marker); }
.steps > li.wait { opacity: .6; }
.steps strong { display: block; }
.steps .btn-row { margin-top: 8px; }

.checks { list-style: none; padding: 0; margin: 8px 0 0; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 0 8px; padding: 4px 0; font-size: 14px; }
.checks .ok { color: var(--ok); } .checks .warn { color: var(--test); } .checks .fail { color: var(--bad); }
.checks .lbl { font-weight: 600; }
.fix { display: block; color: var(--ink-soft); font-size: 13px; }

/* ── 지금 처리할 것 ── */
.todo { list-style: none; margin: 0; padding: 0; border: 1px solid var(--ink); border-radius: 10px; background: var(--sheet); overflow: hidden; }
.todo > li { display: grid; grid-template-columns: 96px 1fr auto; gap: 4px 16px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--rule); }
.todo > li:first-child { border-top: 0; }
.todo .what { min-width: 0; }
.todo .what b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.todo .what .small { display: block; overflow-wrap: anywhere; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-align: center; white-space: nowrap; border: 1px solid var(--rule); }
.tag.run { background: var(--marker-soft); border-color: var(--marker); color: var(--ink); }
.tag.judge { background: var(--marker); border-color: var(--marker); color: var(--on-marker); }
.tag.fail { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.tag.post { border-color: var(--ink); color: var(--ink); }
.todo-empty { border: 1px dashed var(--rule); border-radius: 10px; padding: 20px; color: var(--ink-soft); background: var(--sheet); }
.todo-empty strong { color: var(--ink); display: block; }
.pausebar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; border: 1px solid var(--test); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; background: var(--sheet); }
.pausebar strong { color: var(--test); }
.alert { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }

.pulse { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.pulse.busy { background: var(--marker); box-shadow: 0 0 0 3px var(--marker-soft); }
.pulse.off { background: var(--ink-soft); }
@media (prefers-reduced-motion: no-preference) { .pulse.busy { animation: blink 1.4s ease-in-out infinite; } }
@keyframes blink { 50% { opacity: .35; } }

.auto { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.auto .muted { flex: 1 1 260px; }

/* ── 레포별 현황 (표 대신 줄 — 좁은 화면에서도 접히지 않고 줄바꿈된다) ── */
.repos { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.repos > li { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr); gap: 4px 20px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.repos .name { font-weight: 600; overflow-wrap: anywhere; }
.nums { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 14px; }
.nums span b { font-weight: 700; }
.rate { font: 700 18px/1 var(--serif); }
.empty { padding: 20px; border: 1px dashed var(--rule); border-radius: 8px; color: var(--ink-soft); background: var(--sheet); }

.charts { display: grid; grid-template-columns: 3fr 2fr; gap: 28px; align-items: start; }
.chart-cap { font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
svg text { fill: var(--ink-soft); font: 11px var(--font); }
.cat-row { display: grid; grid-template-columns: 76px 1fr 54px; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
.cat-bar { height: 10px; display: flex; background: var(--rule); border-radius: 2px; overflow: hidden; }
.cat-bar span { display: block; height: 100%; }

details.fold { border-top: 1px solid var(--rule); margin-top: 32px; }
details.fold > summary { cursor: pointer; padding: 12px 0; font-weight: 700; font-size: 17px; }
.log { font-size: 13px; }
.log div { padding: 4px 0; border-bottom: 1px dotted var(--rule); }
.log .warn { color: var(--test); } .log .error { color: var(--bad); }

/* 심각도는 형광펜 줄로 긋는다 — 이 페이지에서 유일하게 튀는 표현 */
.mark { padding: 0 3px; font-weight: 700; white-space: nowrap; }
.mark.MUST_FIX { background: linear-gradient(transparent 50%, color-mix(in srgb, var(--bad) 35%, transparent) 50%); }
.mark.MISSING_TEST { background: linear-gradient(transparent 50%, color-mix(in srgb, var(--test) 40%, transparent) 50%); }
.mark.NICE_TO_HAVE { background: linear-gradient(transparent 50%, var(--marker-soft) 50%); }
.st { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.st.ACCEPTED { color: var(--ok); font-weight: 600; }
.st.REJECTED { color: var(--bad); font-weight: 600; }
.st.NEEDS_JUDGE { background: var(--marker); color: var(--on-marker); padding: 0 4px; font-weight: 600; }

/* ── 리뷰 ── */
.start { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 14px 16px; }
form.inline { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: end; }
.start .check { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chip { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 4px 12px; min-height: 32px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .n { opacity: .75; margin-left: 4px; font-size: 12px; }
.filters { display: grid; grid-template-columns: 1fr 200px; gap: 10px; margin: 0 0 12px; }
.result-count { font-size: 13px; color: var(--ink-soft); margin: 0 0 8px; }
.review { border-top: 1px solid var(--rule); border-left: 4px solid transparent; }
.review:last-child { border-bottom: 1px solid var(--rule); }
.review.needs { border-left-color: var(--marker); background: color-mix(in srgb, var(--marker-soft) 22%, transparent); }
.review.failed { border-left-color: var(--bad); }
.review summary { list-style: none; cursor: pointer; padding: 12px 8px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
.review summary::-webkit-details-marker { display: none; }
.review summary:hover .review-title { text-decoration: underline; text-underline-offset: 3px; }
.review-title { font-weight: 600; overflow-wrap: anywhere; }
.review-meta { color: var(--ink-soft); font-size: 13px; grid-column: 1 / -1; overflow-wrap: anywhere; }
.verdict { font-size: 14px; text-align: right; }
.verdict.high { color: var(--bad); font-weight: 700; }
.review-body { padding: 0 8px 20px; }
.summary-quote { border-left: 3px solid var(--marker); padding: 2px 0 2px 14px; margin: 0 0 16px; white-space: pre-line; max-width: 75ch; }
.finding { padding: 10px 0; border-top: 1px dotted var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.finding-text { white-space: pre-wrap; max-width: 78ch; grid-column: 1 / -1; margin: 0; overflow-wrap: anywhere; }
.loc { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.error-text { color: var(--bad); white-space: pre-wrap; font-size: 13px; overflow-wrap: anywhere; }
.posted-by { font-size: 13px; }

/* ── 폼 ── */
label { display: block; font-size: 13px; color: var(--ink-soft); }
label > input, label > select, label > textarea { display: block; width: 100%; margin-top: 4px; }
input[type=text], input[type=number], input[type=search], select, textarea { border: 1px solid var(--ink-soft); background: var(--sheet); border-radius: 6px; padding: 7px 10px; min-height: 36px; }
textarea { min-height: 90px; resize: vertical; font-size: 13.5px; }
.check { display: flex; align-items: flex-start; gap: 8px; color: var(--ink); font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; }
.check.danger { color: var(--bad); font-weight: 600; }
.check.danger input { accent-color: var(--bad); }

/* ── 학습 ── */
.judge { border: 1px solid var(--rule); border-left: 4px solid var(--marker); border-radius: 6px; padding: 14px; margin-bottom: 12px; background: var(--sheet); }
.reply { white-space: pre-wrap; font-size: 13.5px; border-left: 2px solid var(--ink-soft); padding-left: 10px; margin: 8px 0; overflow-wrap: anywhere; }
.counter { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }
pre.block { white-space: pre-wrap; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; font-size: 13px; max-height: 360px; overflow: auto; }
.rej { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.rej > li { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px 20px; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.rej .cell { min-width: 0; overflow-wrap: anywhere; }

/* ── 설정 ── */
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 14px 20px; margin-bottom: 8px; }
.picker { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; max-width: 680px; margin: 8px 0 20px; }
.repo-card { border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 10px; background: var(--sheet); }
.repo-card[open] { border-color: var(--ink-soft); }
.repo-card.dirty { border-left: 4px solid var(--marker); }
.repo-card > summary { cursor: pointer; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; list-style: none; }
.repo-card > summary::-webkit-details-marker { display: none; }
.repo-card > summary::before { content: "▸"; color: var(--ink-soft); }
.repo-card[open] > summary::before { content: "▾"; }
.repo-name { font-weight: 700; overflow-wrap: anywhere; }
.badges { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 12px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 6px; color: var(--ink-soft); }
.badge.danger { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.chg { font-size: 12px; background: var(--marker); color: var(--on-marker); border-radius: 4px; padding: 0 6px; font-weight: 700; }
.chg[hidden] { display: none; }
.repo-body { padding: 4px 16px 16px; border-top: 1px dotted var(--rule); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 12px 20px; margin-top: 12px; }
.danger-zone { border: 1.5px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 10px 14px; margin-top: 12px; }
.danger-zone p { margin: 4px 0 0 26px; font-size: 13px; color: var(--ink-soft); }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--sheet); border-top: 1px solid var(--ink); }
.savebar-in { max-width: 1040px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; }
.savebar .msg { flex: 1 1 200px; font-size: 14px; }
.savebar .msg.dirty { font-weight: 700; }
.savebar .msg.dirty::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--marker); border: 1px solid var(--ink); margin-right: 8px; }

dialog { border: 1px solid var(--ink); border-radius: 10px; padding: 0; width: min(860px, calc(100vw - 24px)); max-height: calc(100vh - 48px); background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgba(20, 26, 23, .55); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper); }
.dialog-head h2 { margin: 0; font-size: 17px; }
.dialog-body { padding: 16px 20px; overflow: auto; }
.dialog-foot { padding: 12px 20px; border-top: 1px solid var(--rule); display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 8px 12px; position: sticky; bottom: 0; background: var(--paper); }
.dialog-foot .note { margin-right: auto; font-size: 13px; color: var(--bad); }
.preview-body { white-space: pre-wrap; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; font-size: 13.5px; overflow-wrap: anywhere; }
.preview-comment { border-left: 3px solid var(--marker); padding: 4px 0 4px 12px; margin: 12px 0; }
.preview-comment p { white-space: pre-wrap; margin: 4px 0 0; font-size: 13.5px; overflow-wrap: anywhere; }
.warn-box { border: 1px solid var(--test); color: var(--test); border-radius: 6px; padding: 8px 12px; font-size: 14px; margin-bottom: 12px; }

.toast { position: fixed; bottom: 76px; right: 20px; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 6px; font-size: 14px; max-width: min(420px, calc(100vw - 40px)); z-index: 40; }
.toast[hidden] { display: none; }

@media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .top-in { padding: 0 12px; gap: 0 8px; }
  .brand { padding: 12px 0 4px; flex: 1; }
  nav { flex-basis: 100%; order: 3; overflow-x: auto; }
  nav button { padding: 0 12px; }
  .pill { order: 2; margin: 8px 0 4px auto; }
  main { padding: 18px 16px 120px; }
  h1 { font-size: 24px; }
  .review summary { grid-template-columns: 1fr; }
  .verdict { text-align: left; }
  .todo > li { grid-template-columns: 1fr; }
  .todo .tag { justify-self: start; }
  .repos > li, .rej > li { grid-template-columns: 1fr; }
  form.inline, .filters, .picker { grid-template-columns: 1fr; }
  .savebar-in { padding: 10px 16px; }
  .toast { right: 12px; left: 12px; max-width: none; }
}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="top">
  <div class="top-in">
    <p class="brand">review_bot</p>
    <nav aria-label="화면">
      <button data-tab="dashboard">대시보드<span class="count" id="count-todo" aria-label="처리할 것"></span></button>
      <button data-tab="reviews">리뷰</button>
      <button data-tab="learning">학습<span class="count" id="count-judge" aria-label="판정 필요"></span></button>
      <button data-tab="settings">설정</button>
    </nav>
    <a class="pill" id="pill" href="#dashboard"></a>
  </div>
</header>
<main id="main" tabindex="-1"></main>

<dialog id="preview" aria-labelledby="preview-title">
  <div class="dialog-head"><h2 id="preview-title">게시 미리보기</h2><button class="btn ghost" data-close>닫기</button></div>
  <div class="dialog-body" id="preview-body"></div>
  <div class="dialog-foot"><span class="note">게시하면 내 gh 계정 이름으로 PR 에 코멘트가 달립니다.</span><button class="btn ghost" data-close>취소</button><button class="btn primary" id="preview-publish">이 내용으로 게시</button></div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
let state = null;
let doctor = null;
let repoOptions = null;
let tab = (location.hash || '#dashboard').slice(1);
let renderedTab = null;
let settingsDraft = null; // 설정 탭은 편집 중 폴링으로 덮이지 않게 초안을 따로 든다.
let settingsBase = null; // 저장된 값. 초안과 비교해 "저장 안 한 변경" 을 센다.
const openReviews = new Set();
const repoOpen = new Map(); // 설정 레포 카드의 펼침 상태. 기록이 없으면 레포가 적을 때만 펼친다.
const reasonDrafts = new Map(); // 판정 사유를 입력 중일 때 폴링이 지우지 않게.
const filters = { q: '', repo: '', status: '' };

const RISK = { low: '낮음', medium: '중간', high: '높음', unknown: '판단 보류' };
const VERDICT = { approve: '승인 권장', request_changes: '수정 요청', comment: '의견만', undetermined: '판단 보류' };
const SEVERITY = { MUST_FIX: '머지 전 필수', MISSING_TEST: '테스트 누락', NICE_TO_HAVE: '권장' };
// 게시 순서(publish.ts sortBySeverity)와 같게 — sort 는 안정 정렬이라 같은 심각도는 모델 순서를 지킨다.
const SEVERITY_ORDER = { MUST_FIX: 0, MISSING_TEST: 1, NICE_TO_HAVE: 2 };
const CATEGORY = { CORRECTNESS: '정확성', SECURITY: '보안', RELIABILITY: '안정성', TEST: '테스트', ARCHITECTURE: '구조', READABILITY: '가독성', STYLE: '스타일', UNCLASSIFIED: '미분류' };
const STATUS = { NOT_POSTED: '미게시', OPEN: '반응 없음', ACCEPTED: '채택', REJECTED: '기각', NEEDS_JUDGE: '판정 필요', STALE: '반응 없이 닫힘' };
const TRIGGER = { sweep: '자동', manual: '페이지', cli: 'CLI' };
const TARGET = { all: '열린 PR 전부', 'review-requested': '나에게 리뷰 요청된 PR', mine: '내가 올린 PR' };
const DEFAULT_RULES = ['AGENTS.md', 'CLAUDE.md', 'CODE_RULES.md', '.github/copilot-instructions.md', 'REVIEW.md'];
const REASON_MIN = 40;
const TODO_PREVIEW = 6;
const FOCUSABLE = 'button, a[href], input, select, textarea, summary';

// 리뷰 본문·PR 제목·답글은 모델과 PR 작성자가 쓴 글이다. 화면에 넣기 전에 전부 이스케이프한다.
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (url) => (/^https:\/\/github\.com\//.test(url ?? '') ? esc(url) : '#');
const prUrl = (repo, number) => `https://github.com/${encodeURI(repo)}/pull/${number}`;
const ago = (iso) => {
  if (!iso) return '';
  const s = Math.round((Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return '방금';
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  return `${Math.floor(s / 86400)}일 전`;
};
const until = (iso) => {
  if (!iso) return '멈춤';
  const s = Math.round((Date.parse(iso) - Date.now()) / 1000);
  return s <= 0 ? '곧' : s < 3600 ? `${Math.ceil(s / 60)}분 뒤` : `${Math.round(s / 3600)}시간 뒤`;
};
const elapsed = (iso) => {
  if (!iso) return '';
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `${s}초` : `${Math.floor(s / 60)}분 ${s % 60}초`;
};
const duration = (review) => {
  if (!review.finishedAt) return '';
  const s = Math.round((Date.parse(review.finishedAt) - Date.parse(review.createdAt)) / 1000);
  return s < 60 ? `${s}초` : `${Math.floor(s / 60)}분 ${s % 60}초`;
};
const firstLine = (text) => String(text ?? '').split('\n')[0];

const toast = (message) => {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 4500);
};

const api = async (method, path, body) => {
  const response = await fetch(path, {
    method,
    headers: { 'content-type': 'application/json', 'x-review-bot': '1' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `요청 실패 (${response.status})`);
  return data;
};

// 같은 HTML 이면 건드리지 않고, 바꿀 때도 포커스 위치를 같은 순서의 요소로 되돌린다 — 4초 폴링이 키보드 사용자를 튕기지 않게.
// 목록이 늘거나 줄면 순번은 다른 버튼을 가리킨다 — 식별자로 같은 요소를 먼저 찾는다.
const focusKey = (node) => {
  if (node.id) return `#${CSS.escape(node.id)}`;
  const attrs = ['data-action', 'data-id', 'data-value', 'data-field', 'name'].filter((name) => node.hasAttribute(name));
  return attrs.length ? `${node.tagName.toLowerCase()}${attrs.map((name) => `[${name}="${CSS.escape(node.getAttribute(name))}"]`).join('')}` : null;
};
const setHtml = (el, html, force = false) => {
  if (!force && el._html === html) return false;
  const active = el.contains(document.activeElement) ? document.activeElement : null;
  const key = active ? focusKey(active) : null;
  const index = active ? [...el.querySelectorAll(FOCUSABLE)].indexOf(active) : -1;
  el.innerHTML = html;
  el._html = html;
  const target = (key && el.querySelector(key)) || (index >= 0 ? el.querySelectorAll(FOCUSABLE)[index] : null);
  target?.focus({ preventScroll: true });
  return true;
};

const loadDoctor = async (refresh = false) => {
  try { doctor = await api('GET', `/api/doctor${refresh ? '?refresh=1' : ''}`); } catch { doctor = null; }
};

const refresh = async () => {
  try {
    const response = await fetch('/api/state');
    state = await response.json();
    render();
  } catch {
    // 한 번 받은 화면은 그대로 둔다 — 갈아끼우면 설정 초안·입력 중인 값이 사라진다.
    if (state) { toast('서버 연결이 끊겼습니다. 다시 연결을 시도합니다.'); return; }
    setHtml(document.getElementById('main'), `<h1>서버에 연결하지 못했습니다</h1><p class="lede">터미널에서 <code>npm run dev</code> 가 실행 중인지 확인하세요. 켜져 있으면 이 페이지가 저절로 다시 붙습니다.</p>`);
    renderedTab = null;
  }
};

// 입력 중이면 다시 그리지 않는다 — 검색어·사유가 지워지고 커서가 튄다.
const isTyping = () => {
  const el = document.activeElement;
  return el && document.getElementById('main').contains(el) && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
};

/* ── 처리할 것 계산 — 대시보드·탭 배지·리뷰 필터가 같은 기준을 쓴다 ── */
// 같은 PR 은 가장 최근 리뷰만 본다(다시 리뷰했으면 옛 실패·미게시는 잊는다). state.reviews 는 최신순.
const latestReviews = () => {
  const seen = new Set();
  return state.reviews.filter((review) => {
    const key = `${review.repo}#${review.number}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
};
const needsAction = (review) => review.status === 'failed' || (review.status === 'done' && !review.published && review.findings.length > 0);
const mustCount = (review) => review.findings.filter((f) => f.severity === 'MUST_FIX').length;
const todoReviews = () => latestReviews().filter(needsAction).sort((a, b) => (a.status === 'failed' ? 0 : 1) - (b.status === 'failed' ? 0 : 1) || mustCount(b) - mustCount(a));
const todoTotal = () => todoReviews().length + state.judgeQueue.length;

const renderChrome = () => {
  document.querySelectorAll('nav button').forEach((button) => button.setAttribute('aria-current', button.dataset.tab === tab ? 'page' : 'false'));
  const todo = todoTotal();
  document.getElementById('count-todo').textContent = todo || '';
  document.getElementById('count-judge').textContent = state.judgeQueue.length || '';
  const s = state.status;
  const pill = document.getElementById('pill');
  pill.innerHTML = `<span class="pulse ${state.config.paused ? 'off' : s.current ? 'busy' : ''}" aria-hidden="true"></span>${state.config.paused ? '자동 실행 멈춤' : s.current ? esc(`진행 중: ${s.current}`) : '대기 중'}`;
  pill.title = state.viewer ? `gh 계정 ${state.viewer}` : 'gh 로그인 확인 필요';
};

const render = (force = false) => {
  if (!state) return;
  renderChrome();
  const main = document.getElementById('main');
  if (tab === 'settings') {
    if (!settingsDraft || renderedTab !== 'settings') {
      settingsDraft = JSON.parse(JSON.stringify(state.config));
      settingsBase = JSON.parse(JSON.stringify(state.config));
      setHtml(main, renderSettings(), true);
      renderedTab = 'settings';
      syncSettings();
      if (!repoOptions) loadRepoOptions();
    }
    return;
  }
  settingsDraft = null;
  if (!force && renderedTab === tab && isTyping()) return;
  if (tab === 'reviews' && renderedTab === 'reviews' && !force) {
    // 검색·필터 막대는 두고 목록만 바꾼다.
    setHtml(document.getElementById('review-list'), renderReviewList());
    syncChips();
    return;
  }
  const scroll = renderedTab === tab ? window.scrollY : 0;
  const html = tab === 'reviews' ? renderReviews() : tab === 'learning' ? renderLearning() : renderDashboard();
  const sameTab = renderedTab === tab;
  const changed = setHtml(main, html, !sameTab || force);
  renderedTab = tab;
  if (changed) window.scrollTo(0, scroll);
  if (tab === 'reviews') document.getElementById('review-list')._html = null;
};

/* ── 대시보드 ── */
const renderChecks = (results) => `<ul class="checks">${results.map((r) => `<li><span class="${esc(r.level)}" aria-hidden="true">${r.level === 'ok' ? '✓' : r.level === 'warn' ? '!' : '✕'}</span><span><span class="lbl">${esc(r.label)}</span> <span class="muted">${esc(r.detail)}</span>${r.fix && r.level !== 'ok' ? `<span class="fix">${esc(r.fix).replace(/`([^`]+)`/g, '<code>$1</code>')}</span>` : ''}</span></li>`).join('')}</ul>`;

const renderOnboarding = () => {
  const envOk = doctor ? !doctor.some((r) => r.level === 'fail') : false;
  const hasRepos = state.config.repos.length > 0;
  const hasReview = state.reviews.some((r) => r.status === 'done');
  if (envOk && hasRepos && hasReview) return '';
  const current = !envOk ? 0 : !hasRepos ? 1 : 2;
  const cls = (i, done) => (done ? 'done' : i === current ? 'now' : 'wait');
  return `
    <section class="onboard" aria-labelledby="onboard-title">
      <h2 id="onboard-title">처음이라면 이 순서로</h2>
      <p class="muted small" style="margin:0">세 단계를 끝내면 열린 PR 을 알아서 리뷰합니다. 게시는 내가 확인한 뒤에만 합니다.</p>
      <ol class="steps">
        <li class="${cls(0, envOk)}"><div><strong>환경 점검${envOk ? ' 통과' : ''}</strong>
          ${doctor ? renderChecks(envOk ? doctor.filter((r) => r.level !== 'ok') : doctor) : '<span class="muted small">점검 중…</span>'}
          <p class="btn-row"><button class="btn ${current === 0 ? 'primary' : 'ghost'}" data-action="recheck">다시 점검</button></p></div></li>
        <li class="${cls(1, hasRepos)}"><div><strong>감시할 레포 고르기</strong>
          <span class="muted small">${hasRepos ? esc(state.config.repos.map((r) => r.repo).join(', ')) : '설정에서 내 레포 목록 중 고릅니다. 처음에는 "바로 게시" 를 끈 채로 결과만 보는 것을 권합니다.'}</span>
          ${hasRepos ? '' : '<p class="btn-row"><a class="btn primary" href="#settings">레포 고르러 가기</a></p>'}</div></li>
        <li class="${cls(2, hasReview)}"><div><strong>첫 리뷰 돌려 보기</strong>
          <span class="muted small">리뷰 탭에 PR 주소를 붙여 넣거나, 감시 레포가 있으면 아래 "지금 PR 찾기" 를 누르세요. 끝나면 이 화면 맨 위 "지금 처리할 것" 에 올라옵니다.</span>
          <p class="btn-row"><a class="btn ${current === 2 ? 'primary' : 'ghost'}" href="#reviews">PR 하나 리뷰해 보기</a></p></div></li>
      </ol>
    </section>`;
};

const todoItem = (tagClass, tag, main, sub, actions) => `<li><span class="tag ${tagClass}">${tag}</span><div class="what">${main}${sub ? `<span class="small muted">${sub}</span>` : ''}</div><div class="btn-row">${actions}</div></li>`;

const renderTodo = () => {
  const s = state.status;
  const items = [];
  if (s.current) {
    items.push(todoItem('run', '진행 중', `<b>${esc(s.current)} <span class="muted small" data-elapsed="${esc(s.startedAt)}">${elapsed(s.startedAt)}</span></b>`,
      `${s.step ? `${esc(s.step)} · ` : ''}${s.queue.length ? `다음 ${s.queue.length}건 대기` : '대기 중인 작업 없음'}`, ''));
  }
  if (state.judgeQueue.length) {
    const first = state.judgeQueue[0];
    items.push(todoItem('judge', '판정 필요', `<b>답글만 달린 지적 ${state.judgeQueue.length}건</b>`,
      `${esc(first.repo)}#${first.number} 등. 채택·기각을 정해야 학습에 쓰입니다.`, '<a class="btn primary" href="#learning">판정하러 가기</a>'));
  }
  const reviews = todoReviews();
  const shown = reviews.slice(0, Math.max(TODO_PREVIEW, 0));
  for (const review of shown) {
    const name = `${esc(review.repo)}#${review.number} ${esc(review.title || '')}`;
    if (review.status === 'failed') {
      items.push(todoItem('fail', '리뷰 실패', `<b>${name}</b>`, esc(firstLine(review.error)) || '원인을 알 수 없습니다.',
        `<button class="btn primary" data-action="rereview" data-id="${esc(review.id)}">다시 리뷰</button>`));
    } else {
      const must = mustCount(review);
      items.push(todoItem('post', '게시 안 함', `<b>${name}</b>`,
        `지적 ${review.findings.length}건${must ? `, 머지 전 필수 ${must}건` : ''} · ${ago(review.finishedAt || review.createdAt)}`,
        `<button class="btn primary" data-action="preview" data-id="${esc(review.id)}">게시 미리보기</button>`));
    }
  }
  const more = reviews.length - shown.length;
  const body = items.length
    ? `<ul class="todo">${items.join('')}</ul>${more > 0 ? `<p class="small" style="margin:8px 0 0"><a href="#reviews" data-action="filter-todo">나머지 ${more}건 리뷰 탭에서 보기</a></p>` : ''}`
    : `<div class="todo-empty"><strong>지금 처리할 것이 없습니다.</strong>${state.config.paused ? '자동 실행이 멈춰 있어 새 PR 은 들어오지 않습니다.' : `다음 PR 찾기는 ${until(s.nextSweepAt)}입니다.`}</div>`;
  return `<h2 id="todo-h">지금 처리할 것${items.length ? ` <span class="count" style="margin:0">${todoTotal()}</span>` : ''}</h2>${body}`;
};

const trendChart = (trend) => {
  const w = 360, h = 140, padL = 22, padB = 20, barGap = 8;
  const max = Math.max(1, ...trend.map((t) => t.accepted + t.rejected));
  const bw = (w - padL) / trend.length - barGap;
  const unit = (h - padB - 14) / max;
  const bars = trend.map((t, i) => {
    const x = padL + i * (bw + barGap);
    const accH = t.accepted * unit;
    const rejH = t.rejected * unit;
    const label = new Date(t.weekEnd);
    return `<g><title>${label.getMonth() + 1}/${label.getDate()} 까지 한 주: 채택 ${t.accepted}, 기각 ${t.rejected}</title>
      <rect x="${x}" y="${h - padB - accH}" width="${bw}" height="${accH}" fill="var(--ok)"></rect>
      <rect x="${x}" y="${h - padB - accH - rejH}" width="${bw}" height="${rejH}" fill="var(--bad)"></rect>
      <text x="${x + bw / 2}" y="${h - 5}" text-anchor="middle">${label.getMonth() + 1}/${label.getDate()}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="최근 8주 주별 채택과 기각 건수">
    <line x1="${padL}" x2="${w}" y1="${h - padB}" y2="${h - padB}" stroke="var(--rule)"></line>
    <text x="0" y="12">${max}</text><text x="0" y="${h - padB}">0</text>${bars}</svg>`;
};

const renderRepoStats = () => {
  if (state.stats.length === 0) return `<div class="empty">아직 감시하는 레포가 없습니다. <a href="#settings">설정</a>에서 레포를 고르면 ${state.config.sweepIntervalMin}분마다 열린 PR 을 찾아 리뷰합니다.</div>`;
  return `<ul class="repos">${state.stats.map((row) => `<li>
    <div><a class="name" href="#reviews" data-action="filter-repo" data-repo="${esc(row.repo)}">${esc(row.repo)}</a>
      <div class="small muted">${!row.learning ? '학습 꺼짐' : row.learnedCategories.length ? `학습된 규약: ${esc(row.learnedCategories.map((c) => CATEGORY[c] ?? c).join(', '))}` : '학습된 규약 아직 없음'}</div></div>
    <div class="nums"><span>리뷰 <b>${row.reviews}</b></span><span>게시한 지적 <b>${row.posted}</b></span><span>채택 <b>${row.accepted}</b></span><span>기각 <b>${row.rejected}</b></span>
      ${row.needsJudge ? `<a class="st NEEDS_JUDGE" href="#learning">판정 필요 ${row.needsJudge}</a>` : ''}
      <span>채택률 ${row.adoptionRate === null ? '<span class="muted">–</span>' : `<span class="rate">${Math.round(row.adoptionRate * 100)}%</span>`}</span></div>
  </li>`).join('')}</ul>`;
};

const renderDashboard = () => {
  const s = state.status;
  const paused = state.config.paused;
  const repos = state.config.repos;
  const decided = state.trend.reduce((sum, t) => sum + t.accepted + t.rejected, 0);
  const envFail = doctor ? doctor.filter((r) => r.level === 'fail').length : 0;
  const onboarding = renderOnboarding();
  const firstRun = state.reviews.length === 0 && repos.length === 0;
  const maxCat = Math.max(1, ...state.categories.map((c) => c.accepted + c.rejected));
  const charts = decided === 0 && state.categories.length === 0
    ? '<div class="empty">아직 판정된 지적이 없습니다. 게시한 지적에 👍 나 👎 를 누르면 여기에 쌓입니다.</div>'
    : `<div class="charts">
        <div><div class="legend"><span><i style="background:var(--ok)"></i>채택</span><span><i style="background:var(--bad)"></i>기각</span></div>
          ${trendChart(state.trend)}<p class="chart-cap">최근 8주, 판정한 날짜 기준</p></div>
        <div>${state.categories.map((c) => `<div class="cat-row"><span>${esc(CATEGORY[c.category] ?? c.category)}</span>
          <span class="cat-bar" title="채택 ${c.accepted}, 기각 ${c.rejected}"><span style="width:${(c.accepted / maxCat) * 100}%;background:var(--ok)"></span><span style="width:${(c.rejected / maxCat) * 100}%;background:var(--bad)"></span></span>
          <span class="muted">${c.accepted}/${c.rejected}</span></div>`).join('')}
          <p class="chart-cap">종류별 채택/기각. 기각이 많은 종류가 학습 규약 후보입니다.</p></div>
      </div>`;
  return `
    <h1>대시보드</h1>
    <p class="lede">레포 ${repos.length}개 (자동 리뷰 ${repos.filter((r) => r.autoReview).length}개, 바로 게시 ${repos.filter((r) => r.publish).length}개).${state.avgReviewSec ? ` 리뷰 한 건에 평균 ${state.avgReviewSec < 60 ? `${state.avgReviewSec}초` : `${Math.round(state.avgReviewSec / 60)}분`} 걸립니다.` : ''}</p>
    ${onboarding ? '' : envFail ? `<div class="alert" role="alert">환경 점검에서 막힌 항목이 ${envFail}개 있습니다. <a href="#settings">설정의 환경 점검</a>에서 안내를 확인하세요.</div>` : ''}
    ${paused ? `<div class="pausebar"><span><strong>자동 실행이 멈춰 있습니다.</strong> <span class="muted small">새 PR 을 찾지 않고 반응도 걷지 않습니다. 직접 시작한 리뷰는 돌아갑니다.</span></span><button class="btn" data-action="pause">자동 실행 켜기</button></div>` : ''}
    ${onboarding}
    ${firstRun ? '' : renderTodo()}
    <h2>자동 실행 <span class="sub">${paused ? '멈춤' : '켜짐'}</span></h2>
    <div class="auto" aria-live="polite">
      <span class="muted small">다음 PR 찾기 ${paused ? '멈춤' : until(s.nextSweepAt)} · 다음 반응 걷기 ${paused ? '멈춤' : until(s.nextHarvestAt)}</span>
      <span class="btn-row">
        <button class="btn" data-action="sweep">지금 PR 찾기</button>
        <button class="btn" data-action="harvest">지금 반응 걷기</button>
        ${paused ? '' : '<button class="btn ghost" data-action="pause">자동 실행 멈추기</button>'}
      </span>
    </div>
    <h2>레포별 현황</h2>${renderRepoStats()}
    <h2>판정 추이</h2>${charts}
    <details class="fold"><summary>최근 기록 ${state.activity.length ? `<span class="sub">${state.activity.length}건</span>` : ''}</summary>
      <div class="log">${state.activity.length === 0 ? '<p class="muted">기록이 없습니다.</p>' : state.activity.slice(0, 40).map((entry) => `<div class="${esc(entry.level)}"><span class="muted">${ago(entry.at)}</span> ${esc(entry.message)}</div>`).join('')}</div></details>
    <p class="muted small" style="margin-top:24px">상태 파일 ${esc(state.stateFile)}${state.viewer ? ` · gh 계정 ${esc(state.viewer)}` : ' · gh 로그인 확인 필요'}</p>`;
};

/* ── 리뷰 ── */
const renderFinding = (finding) => `
  <div class="finding">
    <div><span class="mark ${esc(finding.severity)}">${SEVERITY[finding.severity] ?? '기타'}</span>
      <span class="small muted">${esc(CATEGORY[finding.category] ?? '미분류')}</span>
      ${finding.file ? `<span class="loc">${esc(finding.file)}${finding.line ? `:${finding.line}` : ''}</span>` : ''}</div>
    <div class="st ${esc(finding.status)}">${finding.commentUrl ? `<a href="${safeUrl(finding.commentUrl)}" target="_blank" rel="noopener">${STATUS[finding.status] ?? '기타'}</a>` : (STATUS[finding.status] ?? '기타')}</div>
    <p class="finding-text">${esc(finding.body)}</p>
  </div>`;

const renderReview = (review) => {
  const r = review.review;
  const head = review.status === 'running' ? '<span class="muted">리뷰 중…</span>'
    : review.status === 'failed' ? '<span class="st REJECTED">실패</span>'
    : `<span class="verdict ${esc(r.riskLevel)}">${review.published ? '' : review.findings.length ? '<span class="tag post">게시 안 함</span> ' : ''}위험도 ${RISK[r.riskLevel] ?? '판단 보류'}, ${VERDICT[r.approvalRecommendation] ?? '판단 보류'}</span>`;
  const extras = [
    TRIGGER[review.trigger], review.modelUsed,
    review.rulesUsed?.length ? `규칙 ${review.rulesUsed.join(', ')}` : null,
    review.learnedCategories?.length ? `학습 규약 ${review.learnedCategories.map((c) => CATEGORY[c] ?? c).join(', ')}` : null,
    duration(review) ? `${duration(review)} 걸림` : null,
    ago(review.createdAt),
  ].filter(Boolean).map(esc).join(' · ');
  let body = '';
  if (review.status === 'failed') {
    body = `<p class="error-text">${esc(review.error)}</p><p class="btn-row"><button class="btn" data-action="rereview" data-id="${esc(review.id)}">다시 리뷰</button></p>`;
  } else if (r) {
    const actions = review.published
      ? `<p class="posted-by">게시함 <a href="${safeUrl(review.published.url)}" target="_blank" rel="noopener">GitHub 에서 보기</a> (${ago(review.published.at)})</p>`
      : `<p class="btn-row"><button class="btn primary" data-action="preview" data-id="${esc(review.id)}">게시 미리보기</button><span class="muted small">어느 줄에 무엇이 달릴지 먼저 보여 줍니다.</span></p>`;
    body = `
      ${r.summary ? `<blockquote class="summary-quote">${esc(r.summary)}</blockquote>` : ''}
      ${r.undeterminedReason ? `<p class="small muted">판단 보류 사유: ${esc(r.undeterminedReason)}</p>` : ''}
      ${review.truncated ? '<p class="small" style="color:var(--test)">diff 가 커서 뒷부분은 보지 못했습니다.</p>' : ''}
      ${review.findings.length ? [...review.findings].sort((a, b) => (SEVERITY_ORDER[a.severity] ?? 9) - (SEVERITY_ORDER[b.severity] ?? 9)).map(renderFinding).join('') : '<p class="muted">지적 사항이 없습니다.</p>'}
      ${actions}
      <p class="btn-row small" style="margin-top:12px"><a href="${safeUrl(prUrl(review.repo, review.number))}" target="_blank" rel="noopener">PR 열기</a><button class="btn ghost" data-action="rereview" data-id="${esc(review.id)}">다시 리뷰</button></p>`;
  }
  const cls = review.status === 'failed' ? 'failed' : needsAction(review) ? 'needs' : '';
  return `<details class="review ${cls}" data-review="${esc(review.id)}" ${openReviews.has(review.id) ? 'open' : ''}>
    <summary><span class="review-title">${esc(review.repo)}#${review.number} ${esc(review.title || '(조회 중)')}</span>${head}<span class="review-meta">${extras}</span></summary>
    <div class="review-body">${body}</div>
  </details>`;
};

const matchesFilters = (review, todoIds) => {
  if (filters.repo && review.repo !== filters.repo) return false;
  if (filters.status === 'todo' && !todoIds.has(review.id)) return false;
  if (filters.status === 'posted' && !review.published) return false;
  if (filters.status === 'failed' && review.status !== 'failed') return false;
  if (filters.status === 'must' && !review.findings.some((f) => f.severity === 'MUST_FIX')) return false;
  if (filters.q) {
    const hay = `${review.repo}#${review.number} ${review.title} ${review.review?.summary ?? ''} ${review.findings.map((f) => `${f.file ?? ''} ${f.body}`).join(' ')}`.toLowerCase();
    if (!hay.includes(filters.q.toLowerCase())) return false;
  }
  return true;
};

const CHIPS = [['', '전체'], ['todo', '처리 필요'], ['must', '머지 전 필수 있음'], ['failed', '실패'], ['posted', '게시함']];
// 칩마다 "누르면 몇 건인지" — 레포·검색 조건은 그대로 두고 상태만 바꿔 센다.
const chipCount = (value) => {
  const todoIds = new Set(todoReviews().map((r) => r.id));
  const saved = filters.status;
  filters.status = value;
  const n = state.reviews.filter((review) => matchesFilters(review, todoIds)).length;
  filters.status = saved;
  return n;
};
const renderChips = () => `<div class="chips" role="group" aria-label="상태로 거르기" id="chips">${CHIPS.map(([value, label]) =>
  `<button type="button" class="chip" data-action="chip" data-value="${value}" aria-pressed="${filters.status === value}">${label}<span class="n">${chipCount(value)}</span></button>`).join('')}</div>`;
const syncChips = () => document.querySelectorAll('#chips .chip').forEach((chip) => {
  chip.setAttribute('aria-pressed', String(chip.dataset.value === filters.status));
  chip.querySelector('.n').textContent = chipCount(chip.dataset.value);
});

const renderReviewList = () => {
  if (state.reviews.length === 0) return '<div class="empty">아직 리뷰가 없습니다. 위에 PR 주소를 넣거나 설정에서 감시할 레포를 고르세요.</div>';
  const todoIds = new Set(todoReviews().map((r) => r.id));
  const shown = state.reviews.filter((review) => matchesFilters(review, todoIds));
  return `<p class="result-count">${shown.length === state.reviews.length ? `${shown.length}건` : `${state.reviews.length}건 중 ${shown.length}건`}</p>
    ${shown.length ? shown.map(renderReview).join('') : '<div class="empty">조건에 맞는 리뷰가 없습니다.</div>'}`;
};

const renderReviews = () => {
  const repos = [...new Set(state.reviews.map((r) => r.repo))].sort();
  return `
    <h1>리뷰</h1>
    <p class="lede">자동 실행, 이 페이지, CLI 로 돌린 리뷰가 모두 여기 쌓입니다. 리뷰는 한 번에 하나씩 차례로 돌고${state.avgReviewSec ? ` 평균 ${Math.max(1, Math.round(state.avgReviewSec / 60))}분` : ' 보통 1~5분'} 걸립니다.</p>
    <form class="inline start" id="review-form" aria-label="PR 직접 리뷰">
      <label>PR 주소 또는 owner/repo#번호<input type="text" name="pr" required placeholder="https://github.com/owner/repo/pull/123"></label>
      <label>모델<select name="provider"><option value="">설정값 (${esc(state.config.provider)})</option><option value="codex">codex</option><option value="claude">claude</option></select></label>
      <button class="btn primary" type="submit">리뷰 시작</button>
      <label class="check danger"><input type="checkbox" name="publish"><span>끝나면 확인 없이 바로 게시 <span class="muted small" style="font-weight:400">(끄면 결과만 쌓이고, 아래에서 미리보기 후 게시합니다)</span></span></label>
    </form>
    <h2>지난 리뷰</h2>
    ${renderChips()}
    <div class="filters" role="search">
      <label>검색<input type="search" id="filter-q" value="${esc(filters.q)}" placeholder="PR 번호, 제목, 파일, 지적 내용"></label>
      <label>레포<select id="filter-repo"><option value="">전체</option>${repos.map((r) => `<option ${filters.repo === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label>
    </div>
    <div id="review-list">${renderReviewList()}</div>`;
};

/* ── 학습 ── */
const counterText = (value) => {
  const n = value.trim().length;
  return n === 0 ? '비워 두면 수확한 내 답글을 사유로 씁니다.' : n < REASON_MIN ? `${n}자 — ${REASON_MIN}자 미만이면 학습에 쓰이지 않습니다.` : `${n}자`;
};

const renderLearning = () => {
  const judge = state.judgeQueue.length === 0
    ? '<p class="muted">판정할 지적이 없습니다. 👍·👎 없이 답글만 달린 지적이 여기 모입니다.</p>'
    : state.judgeQueue.map((finding) => {
      const draft = reasonDrafts.get(finding.id) ?? finding.rejectReason ?? '';
      return `
      <div class="judge">
        <div><span class="mark ${esc(finding.severity)}">${SEVERITY[finding.severity] ?? '기타'}</span> <span class="small muted">${esc(CATEGORY[finding.category] ?? '미분류')}</span>
          <span class="loc">${esc(finding.repo)}#${finding.number} ${esc(finding.file ?? '')}${finding.line ? `:${finding.line}` : ''}</span>
          ${finding.commentUrl ? `<a class="small" href="${safeUrl(finding.commentUrl)}" target="_blank" rel="noopener">스레드 열기</a>` : ''}</div>
        <p class="finding-text" style="margin-top:6px">${esc(finding.body)}</p>
        <div class="reply"><span class="small muted">내 답글</span><br>${esc(finding.replyBody)}</div>
        <label>기각 사유
          <textarea data-reason="${esc(finding.id)}" aria-describedby="c-${esc(finding.id)}">${esc(draft)}</textarea></label>
        <p class="counter" id="c-${esc(finding.id)}" data-counter>${counterText(draft)}</p>
        <p class="btn-row" style="margin-top:10px">
          <button class="btn" data-action="judge" data-decision="ACCEPTED" data-id="${esc(finding.id)}">채택 (맞는 지적)</button>
          <button class="btn primary" data-action="judge" data-decision="REJECTED" data-id="${esc(finding.id)}">기각 (이 레포에선 정상)</button>
        </p>
      </div>`;
    }).join('');
  const conventions = state.stats.filter((row) => row.learning).map((row) => `
    <h3>${esc(row.repo)}</h3>
    ${row.learnedBlock ? `<pre class="block">${esc(row.learnedBlock)}</pre>` : '<p class="muted small">아직 규약이 없습니다. 같은 종류의 지적이 최근 90일 안에 두 번 이상 사유와 함께 기각되면 생깁니다.</p>'}`).join('');
  const rejected = state.rejected.length === 0
    ? '<p class="muted">기각된 지적이 없습니다.</p>'
    : `<ul class="rej">${state.rejected.map((finding) => `<li>
        <div class="cell"><span class="small muted">${esc(finding.repo)}#${finding.number} ${esc(CATEGORY[finding.category] ?? '미분류')}</span><br>${esc(finding.body.slice(0, 160))}${finding.body.length > 160 ? '…' : ''}</div>
        <div class="cell small">${finding.rejectReason ? esc(finding.rejectReason.slice(0, 240)) : '<span class="muted">사유 없음 (학습 안 됨)</span>'}</div>
        <div><label class="check"><input type="checkbox" data-action="exclude" data-id="${esc(finding.id)}" ${finding.excluded ? '' : 'checked'}> 학습에 사용</label></div>
      </li>`).join('')}</ul>`;
  return `
    <h1>학습</h1>
    <p class="lede">게시한 지적에 👎 와 함께 남긴 내 답글이 기각 사유가 됩니다. 사유가 쌓이면 다음 리뷰부터 그 레포의 규약으로 실립니다. 보안 지적은 학습하지 않습니다.</p>
    <h2>판정 필요${state.judgeQueue.length ? ` <span class="count" style="margin:0">${state.judgeQueue.length}</span>` : ''}</h2>
    ${judge}
    <h2>다음 리뷰에 실릴 규약</h2>
    ${conventions || '<p class="muted">학습을 켠 레포가 없습니다.</p>'}
    <h2>기각된 지적 <span class="sub">잘못 굳은 규약은 "학습에 사용" 을 꺼서 빼세요</span></h2>
    ${rejected}`;
};

/* ── 설정 ── */
const repoBadges = (repo) => `${repo.publish ? '<span class="badge danger">바로 게시</span>' : '<span class="badge">게시는 직접</span>'}<span class="badge">${repo.autoReview ? '자동 리뷰' : '수동만'}</span>${repo.learning ? '' : '<span class="badge">학습 꺼짐</span>'}`;

const repoCard = (repo, index) => `

        <p>내 gh 계정 이름으로 코멘트가 달립니다. 처음에는 꺼 두고 결과를 본 뒤 켜는 것을 권합니다. 켜고 저장할 때 한 번 더 확인합니다.</p>

        <label>직접 적는 규약 (이 레포에서 정상인 것)<textarea data-field="extraRules" placeholder="예: 마이그레이션 파일은 만들지 않는다. 스키마 변경은 db:push 로 끝난다.">${esc(repo.extraRules)}</textarea></label>

      <div id="repo-list">${c.repos.length ? c.repos.map(repoCard).join('') : '<div class="empty">레포를 추가하세요. 처음에는 "바로 게시" 를 끈 채로 결과를 먼저 보는 것을 권합니다.</div>'}</div>

const loadRepoOptions = async (reload = false) => {
  try {
    repoOptions = await api('GET', `/api/repos${reload ? '?refresh=1' : ''}`);
  } catch (error) {
    repoOptions = [];
    toast(`레포 목록을 못 불러왔습니다: ${error.message}`);
  }
  const list = document.getElementById('repo-options');
  if (list) {
    list.innerHTML = repoOptions.map((r) => `<option value="${esc(r.repo)}">${r.private ? '비공개' : '공개'}, ${ago(r.pushedAt)} push</option>`).join('');
    document.getElementById('repo-hint').textContent = `내 레포 ${repoOptions.length}개에서 고를 수 있습니다.`;
  }
};

// 화면의 값을 초안에 모은다 — 레포 추가·빼기로 다시 그릴 때 입력 중인 값을 잃지 않게.
const collectSettings = () => {
  const form = document.getElementById('settings-form');
  if (!form || !settingsDraft) return;
  const data = new FormData(form);
  settingsDraft.provider = data.get('provider');
  settingsDraft.modelName = data.get('modelName');
  // 빈 칸을 Number('') === 0 으로 받으면 "0 으로 바꿈" 이 된다. 빈 칸은 NaN 으로 두어 서버가 거절하게 한다.
  for (const key of ['sweepIntervalMin', 'harvestIntervalMin', 'inlineMax', 'timeoutSec']) settingsDraft[key] = String(data.get(key) ?? '').trim() === '' ? NaN : Number(data.get(key));
  form.querySelectorAll('.repo-card').forEach((card) => {
    const repo = settingsDraft.repos[Number(card.dataset.index)];
    card.querySelectorAll('[data-field]').forEach((input) => {
      const field = input.dataset.field;
      if (input.type === 'checkbox') repo[field] = input.checked;
      else if (field === 'rulesFiles') repo[field] = input.value.split('\n').map((line) => line.trim()).filter(Boolean);
      else repo[field] = input.value;
    });
  });
};

// 저장한 값과 다른 곳이 몇 군데인지 센다. 레포 한 개는 안에서 몇 개를 바꿨든 한 곳이다.
const changedRepos = () => {
  const base = new Map(settingsBase.repos.map((repo) => [repo.repo, repo]));
  return new Set(settingsDraft.repos.filter((repo) => {
    const old = base.get(repo.repo);
    return !old || Object.keys(repo).some((key) => JSON.stringify(repo[key]) !== JSON.stringify(old[key]));
  }).map((repo) => repo.repo));
};
const settingsChangeCount = () => {
  if (!settingsDraft || !settingsBase) return 0;
  const globals = ['provider', 'modelName', 'sweepIntervalMin', 'harvestIntervalMin', 'inlineMax', 'timeoutSec'].filter((key) => settingsDraft[key] !== settingsBase[key]).length;
  const removed = settingsBase.repos.filter((old) => !settingsDraft.repos.some((repo) => repo.repo === old.repo)).length;
  return globals + removed + changedRepos().size;
};
const settingsDirty = () => document.getElementById('settings-form') !== null && settingsChangeCount() > 0;

// 입력할 때마다: 초안 갱신 → 저장 막대·레포 카드 표시 갱신. 다시 그리지 않아 포커스가 그대로다.
const syncSettings = () => {
  collectSettings();
  const n = settingsChangeCount();
  const msg = document.getElementById('save-msg');
  if (!msg) return;
  const publishOn = settingsDraft.repos.filter((repo) => repo.publish && !settingsBase.repos.find((old) => old.repo === repo.repo && old.publish));
  msg.className = `msg${n ? ' dirty' : ''}`;
  msg.textContent = n ? `저장 안 한 변경 ${n}곳${publishOn.length ? ` · 바로 게시를 새로 켠 레포 ${publishOn.length}개` : ''}` : '변경 없음';
  document.getElementById('save-btn').disabled = n === 0;
  document.getElementById('reset-btn').disabled = n === 0;
  const dirtyRepos = changedRepos();
  document.querySelectorAll('.repo-card').forEach((card) => {
    const repo = settingsDraft.repos[Number(card.dataset.index)];
    card.classList.toggle('dirty', dirtyRepos.has(repo.repo));
    card.querySelector('.chg').hidden = !dirtyRepos.has(repo.repo);
    card.querySelector('[data-badges]').innerHTML = repoBadges(repo);
  });
  const total = document.getElementById('repo-total');
  if (total) total.textContent = `${settingsDraft.repos.length}개 · 바로 게시 ${settingsDraft.repos.filter((repo) => repo.publish).length}개`;
};
const rerenderSettings = () => { setHtml(document.getElementById('main'), renderSettings(), true); syncSettings(); };

/* ── 게시 미리보기 ── */
const dialog = document.getElementById('preview');
let previewId = null;
const openPreview = async (id) => {
  previewId = id;
  const bodyEl = document.getElementById('preview-body');
  const publishBtn = document.getElementById('preview-publish');
  bodyEl.innerHTML = '<p class="muted">지금 PR 상태로 게시 내용을 계산하는 중…</p>';
  publishBtn.disabled = true;
  dialog.showModal();
  try {
    const p = await api('GET', `/api/reviews/${id}/preview`);
    bodyEl.innerHTML = `
      ${p.stale ? `<div class="warn-box">리뷰 뒤 새 커밋이 올라와 게시할 수 없습니다 (${esc(p.headSha.slice(0, 7))}). "다시 리뷰" 로 새 커밋을 리뷰하세요.</div>` : ''}
      <h3 style="margin-top:0">리뷰 본문</h3><div class="preview-body">${esc(p.body)}</div>
      <h3>줄에 다는 코멘트 ${p.comments.length}건</h3>
      ${p.comments.length ? p.comments.map((c) => `<div class="preview-comment"><span class="loc">${esc(c.path)}:${c.line}</span><p>${esc(c.body)}</p></div>`).join('') : '<p class="muted small">줄에 붙일 수 있는 지적이 없어 전부 본문 목록으로 갑니다.</p>'}
      ${p.droppedCount ? `<p class="muted small">우선순위가 낮은 ${p.droppedCount}건은 게시하지 않습니다 (상한 ${state.config.inlineMax}건, 설정에서 바꿀 수 있음).</p>` : ''}`;
    publishBtn.disabled = p.stale;
  } catch (error) {
    bodyEl.innerHTML = `<p class="error-text">${esc(error.message)}</p>`;
  }
};
dialog.addEventListener('click', (event) => { if (event.target.closest('[data-close]')) dialog.close(); });
document.getElementById('preview-publish').addEventListener('click', async (event) => {
  event.target.disabled = true;
  try {
    await api('POST', `/api/reviews/${previewId}/publish`);
    dialog.close();
    toast('게시를 대기열에 넣었습니다. 몇 초 뒤 "게시함" 으로 바뀝니다.');
    await refresh();
  } catch (error) { toast(error.message); event.target.disabled = false; }
});

/* ── 이벤트 ── */
const goTab = (next) => {
  if (tab === 'settings' && next !== 'settings' && settingsDirty() && !confirm('저장하지 않은 설정 변경이 있습니다. 버리고 나갈까요?')) {
    if (location.hash.slice(1) !== 'settings') location.hash = 'settings';
    return;
  }
  tab = next;
  if (location.hash.slice(1) !== next) location.hash = next;
  settingsDraft = null;
  render(true);
};
document.querySelector('nav').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-tab]');
  if (!button) return;
  goTab(button.dataset.tab);
  document.getElementById('main').focus();
});
window.addEventListener('hashchange', () => {
  const next = location.hash.slice(1) || 'dashboard';
  if (next !== tab) goTab(next);
});
window.addEventListener('beforeunload', (event) => { if (tab === 'settings' && settingsDirty()) { event.preventDefault(); event.returnValue = ''; } });

const main = document.getElementById('main');
main.addEventListener('toggle', (event) => {
  const el = event.target;
  if (el.dataset?.review) { if (el.open) openReviews.add(el.dataset.review); else openReviews.delete(el.dataset.review); }
  if (el.dataset?.repo) repoOpen.set(el.dataset.repo, el.open);
}, true);

// 레포 검색창의 Enter 는 설정 저장이 아니라 "추가" 다.
main.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && event.target.id === 'new-repo') {
    event.preventDefault();
    document.querySelector('[data-action="add-repo"]')?.click();
  }
});

main.addEventListener('input', (event) => {
  const el = event.target;
  if (el.id === 'filter-q') { filters.q = el.value; setHtml(document.getElementById('review-list'), renderReviewList()); return; }
  if (el.id === 'repo-filter') {
    const q = el.value.trim().toLowerCase();
    document.querySelectorAll('.repo-card').forEach((card) => { card.hidden = q !== '' && !card.dataset.repo.toLowerCase().includes(q); });
    return;
  }
  if (el.dataset.reason) {
    reasonDrafts.set(el.dataset.reason, el.value);
    el.closest('.judge').querySelector('[data-counter]').textContent = counterText(el.value);
    return;
  }
  if (el.closest('#settings-form') && el.id !== 'new-repo') syncSettings();
});

main.addEventListener('click', async (event) => {
  const el = event.target.closest('[data-action]');
  if (!el || el.tagName === 'INPUT') return;
  const action = el.dataset.action;
  try {
    if (action === 'sweep') { const r = await api('POST', '/api/sweep'); toast(r.queued ? 'PR 찾기를 대기열에 넣었습니다.' : '이미 대기 중입니다.'); }
    if (action === 'harvest') { const r = await api('POST', '/api/harvest'); toast(r.queued ? '반응 걷기를 대기열에 넣었습니다.' : '이미 대기 중입니다.'); }
    if (action === 'pause') { await api('POST', '/api/pause', { paused: !state.config.paused }); }
    if (action === 'preview') { await openPreview(el.dataset.id); return; }
    if (action === 'rereview') { const r = await api('POST', `/api/reviews/${el.dataset.id}/rereview`); toast(r.queued ? '다시 리뷰를 대기열에 넣었습니다.' : '같은 리뷰가 이미 대기 중입니다.'); }
    if (action === 'filter-repo') { filters.repo = el.dataset.repo; filters.status = ''; filters.q = ''; return; }
    if (action === 'filter-todo') { filters.repo = ''; filters.status = 'todo'; filters.q = ''; return; }
    if (action === 'chip') { filters.status = el.dataset.value; syncChips(); setHtml(document.getElementById('review-list'), renderReviewList()); return; }
    if (action === 'recheck') {
      el.disabled = true;
      await loadDoctor(true);
      const box = document.getElementById('doctor-box');
      if (box) box.innerHTML = renderChecks(doctor); else render(true);
      toast(doctor && !doctor.some((r) => r.level === 'fail') ? '환경 점검을 통과했습니다.' : '막힌 항목의 안내를 따라 주세요.');
      el.disabled = false;
      return;
    }
    if (action === 'judge') {
      const reason = reasonDrafts.get(el.dataset.id) ?? document.querySelector(`textarea[data-reason="${CSS.escape(el.dataset.id)}"]`)?.value ?? '';
      await api('POST', `/api/findings/${el.dataset.id}/judge`, { decision: el.dataset.decision, reason });
      reasonDrafts.delete(el.dataset.id);
      toast(el.dataset.decision === 'ACCEPTED' ? '채택으로 기록했습니다.' : '기각으로 기록했습니다.');
    }
    if (action === 'reload-repos') { await loadRepoOptions(true); return; }
    if (action === 'add-repo') {
      collectSettings();
      const input = document.getElementById('new-repo');
      let name = input.value.trim().replace(/^https:\/\/github\.com\//, '').replace(/\/$/, '');
      // 이름만 치면(owner 없이) 내 레포 목록에서 찾아 맞춘다.
      if (name && !name.includes('/')) {
        const found = (repoOptions ?? []).filter((r) => r.repo.split('/')[1].toLowerCase() === name.toLowerCase());
        if (found.length === 1) name = found[0].repo;
        else if (found.length > 1) { toast(`같은 이름이 여러 개입니다: ${found.map((r) => r.repo).join(', ')}. owner 까지 적어 주세요.`); return; }
      }
      if (!/^[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+$/.test(name)) { toast('owner/repo 형식으로 입력하거나 목록에서 고르세요.'); return; }
      if (settingsDraft.repos.some((repo) => repo.repo.toLowerCase() === name.toLowerCase())) { toast('이미 있는 레포입니다.'); return; }
      settingsDraft.repos.push({ repo: name, autoReview: true, publish: false, target: 'all', skipDrafts: true, learning: true, rulesFiles: [...DEFAULT_RULES], extraRules: '' });
      repoOpen.set(name, true);
      rerenderSettings();
      toast(`${name} 을 추가했습니다. "설정 저장" 을 눌러야 적용됩니다.`);
      return;
    }
    if (action === 'remove-repo') {
      collectSettings();
      const [removed] = settingsDraft.repos.splice(Number(el.dataset.index), 1);
      rerenderSettings();
      toast(`${removed.repo} 을 뺐습니다. "설정 저장" 을 눌러야 적용됩니다.`);
      return;
    }
    if (action === 'reset-settings') { settingsDraft = JSON.parse(JSON.stringify(state.config)); rerenderSettings(); return; }
    await refresh();
  } catch (error) {
    toast(error.message);
    el.disabled = false;
  }
});

main.addEventListener('change', async (event) => {
  const el = event.target;
  if (el.id === 'filter-repo') {
    filters.repo = el.value;
    setHtml(document.getElementById('review-list'), renderReviewList());
    return;
  }
  if (el.closest('#settings-form') && el.id !== 'new-repo') { syncSettings(); return; }
  if (el.dataset.action !== 'exclude') return;
  try {
    await api('POST', `/api/findings/${el.dataset.id}/exclude`, { excluded: !el.checked });
    toast(el.checked ? '학습에 다시 씁니다.' : '학습에서 뺐습니다.');
    await refresh();
  } catch (error) { toast(error.message); }
});

main.addEventListener('submit', async (event) => {
  event.preventDefault();
  try {
    if (event.target.id === 'review-form') {
      const data = new FormData(event.target);
      const publish = data.get('publish') === 'on';
      if (publish && !confirm('리뷰가 끝나면 확인 없이 PR 에 게시합니다. 진행할까요?')) return;
      const r = await api('POST', '/api/review', { pr: data.get('pr'), provider: data.get('provider') || undefined, publish });
      toast(r.queued ? '리뷰를 대기열에 넣었습니다. 대시보드에서 진행 상황을 볼 수 있습니다.' : '같은 리뷰가 이미 대기 중입니다.');
      event.target.reset();
      document.activeElement?.blur();
      await refresh();
    }
    if (event.target.id === 'settings-form') {
      collectSettings();
      const turningOn = settingsDraft.repos.filter((repo) => repo.publish && !state.config.repos.find((old) => old.repo === repo.repo && old.publish));
      if (turningOn.length && !confirm(`${turningOn.map((r) => r.repo).join(', ')} 은 리뷰가 끝나면 확인 없이 게시됩니다. 저장할까요?`)) return;
      await api('PUT', '/api/config', { ...settingsDraft, paused: state.config.paused });
      toast('설정을 저장했습니다.');
      settingsDraft = null;
      renderedTab = null;
      await refresh();
    }
  } catch (error) { toast(error.message); }
});

// 경과 시간만 1초마다 갱신한다.
setInterval(() => {
  document.querySelectorAll('[data-elapsed]').forEach((el) => { el.textContent = elapsed(el.dataset.elapsed); });
}, 1000);

loadDoctor().then(() => { if (tab === 'dashboard') render(true); });
refresh();
// 설정 탭은 render 가 상단 상태 표시만 갱신하고 본문은 건드리지 않는다.
setInterval(() => { if (!dialog.open) refresh(); }, 4000);
</script>
</body>
</html>
