<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>review_bot</title>
<style>
:root {
  --paper: #F1F3EE;
  --sheet: #FBFCF9;
  --ink: #1E2622;
  --ink-soft: #5B655F;
  --rule: #D6DBD2;
  --marker: #F4D35E;
  --marker-soft: #F8E7A3;
  --ok: #2F7A55;
  --bad: #A8343F;
  --test: #C98B2B;
  --font: "Apple SD Gothic Neo", "Pretendard", -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #161B18;
    --sheet: #1D2420;
    --ink: #E4E9E4;
    --ink-soft: #9AA59E;
    --rule: #2F3833;
    --marker: #C9A93A;
    --marker-soft: #5A4C1C;
    --ok: #5DB88A;
    --bad: #E07A84;
    --test: #E0AE5A;
  }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; color: var(--ink); background: var(--paper);
  font: 15px/1.6 var(--font); font-variant-numeric: tabular-nums;
}
a { color: inherit; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
nav {
  border-right: 1px solid var(--rule); padding: 28px 20px; position: sticky; top: 0; height: 100vh;
}
.brand { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
.brand-sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 28px; }
nav button {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px;
  margin-bottom: 2px; border-radius: 6px; cursor: pointer; font-size: 15px;
}
nav button[aria-current="page"] { font-weight: 700; background: linear-gradient(transparent 55%, var(--marker) 55%); border-radius: 0; }
nav .count { float: right; color: var(--ink-soft); font-size: 13px; }
.viewer { position: absolute; bottom: 24px; left: 20px; right: 20px; color: var(--ink-soft); font-size: 12px; word-break: break-all; }

main { padding: 32px 40px 80px; max-width: 1100px; width: 100%; }
h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; line-height: 1.25; }
h2 { font-size: 18px; margin: 40px 0 12px; }
h3 { font-size: 15px; margin: 20px 0 8px; }
.lede { color: var(--ink-soft); margin: 0 0 24px; max-width: 70ch; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }

.state-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 28px; }
.pulse { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
.pulse.off { background: var(--ink-soft); }
.btn {
  border: 1px solid var(--ink); background: var(--sheet); padding: 6px 14px; border-radius: 6px; cursor: pointer;
}
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.ghost { border-color: var(--rule); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--ink-soft); padding: 8px 10px; border-bottom: 1px solid var(--ink); }
td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num, th.num { text-align: right; }
.empty { padding: 24px; border: 1px dashed var(--rule); border-radius: 8px; color: var(--ink-soft); }

/* 심각도는 형광펜 줄로 긋는다 — 이 페이지에서 유일하게 튀는 표현 */
.mark { padding: 0 3px; font-weight: 700; white-space: nowrap; }
.mark.MUST_FIX { background: linear-gradient(transparent 50%, color-mix(in srgb, var(--bad) 35%, transparent) 50%); }
.mark.MISSING_TEST { background: linear-gradient(transparent 50%, color-mix(in srgb, var(--test) 40%, transparent) 50%); }
.mark.NICE_TO_HAVE { background: linear-gradient(transparent 50%, var(--marker-soft) 50%); }
.st { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.st.ACCEPTED { color: var(--ok); font-weight: 600; }
.st.REJECTED { color: var(--bad); font-weight: 600; }
.st.NEEDS_JUDGE { background: var(--marker); color: #1E2622; padding: 0 4px; font-weight: 600; }

.review { border-top: 1px solid var(--rule); }
.review:last-child { border-bottom: 1px solid var(--rule); }
.review summary { list-style: none; cursor: pointer; padding: 14px 4px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
.review summary::-webkit-details-marker { display: none; }
.review-title { font-weight: 600; }
.review-meta { color: var(--ink-soft); font-size: 13px; grid-column: 1 / -1; }
.verdict { font-size: 14px; text-align: right; }
.verdict.high { color: var(--bad); font-weight: 700; }
.review-body { padding: 0 4px 20px; }
.summary-quote { border-left: 3px solid var(--marker); padding: 2px 0 2px 14px; margin: 0 0 16px; white-space: pre-line; max-width: 75ch; }
.finding { padding: 10px 0; border-top: 1px dotted var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.finding-text { white-space: pre-wrap; max-width: 78ch; grid-column: 1 / -1; }
.loc { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; color: var(--ink-soft); }
.error-text { color: var(--bad); white-space: pre-wrap; font-size: 13px; }

form.inline { display: grid; grid-template-columns: 2fr 1fr auto auto; gap: 10px; align-items: end; margin-bottom: 8px; }
label { display: block; font-size: 13px; color: var(--ink-soft); }
label > input, label > select, label > textarea { display: block; width: 100%; margin-top: 4px; }
input[type=text], input[type=number], select, textarea {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 7px 10px;
}
textarea { min-height: 90px; resize: vertical; font-size: 13.5px; }
.check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; }
.check input { width: auto; margin: 0; }

.repo-card { border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; background: var(--sheet); }
.repo-card header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.repo-card header strong { font-size: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 20px; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 20px; margin-bottom: 8px; }
pre.block { white-space: pre-wrap; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; font-size: 13px; max-height: 360px; overflow: auto; }
.judge { border: 1px solid var(--rule); border-left: 4px solid var(--marker); border-radius: 6px; padding: 14px; margin-bottom: 12px; background: var(--sheet); }
.reply { white-space: pre-wrap; font-size: 13.5px; border-left: 2px solid var(--rule); padding-left: 10px; margin: 8px 0; }
.log { font-size: 13px; }
.log div { padding: 4px 0; border-bottom: 1px dotted var(--rule); }
.log .warn { color: var(--test); }
.log .error { color: var(--bad); }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 6px; font-size: 14px; max-width: 420px; }
.toast[hidden] { display: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 16px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .brand-sub, .viewer { display: none; }
  .brand { margin: 0 12px 0 0; }
  nav button { width: auto; }
  main { padding: 20px 16px 60px; }
  form.inline { grid-template-columns: 1fr; }
  .table-wrap { overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <nav aria-label="화면">
    <p class="brand">review_bot</p>
    <p class="brand-sub">PR 리뷰와 학습</p>
    <button data-tab="dashboard">대시보드</button>
    <button data-tab="reviews">리뷰 <span class="count" id="count-reviews"></span></button>
    <button data-tab="learning">학습 <span class="count" id="count-judge"></span></button>
    <button data-tab="settings">설정</button>
    <div class="viewer" id="viewer"></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
let state = null;
let tab = (location.hash || '#dashboard').slice(1);
let settingsDraft = null; // 설정 탭은 편집 중 폴링으로 덮이지 않게 초안을 따로 든다.
const openReviews = new Set();

const RISK = { low: '낮음', medium: '중간', high: '높음', unknown: '판단 보류' };
const VERDICT = { approve: '승인 권장', request_changes: '수정 요청', comment: '의견만', undetermined: '판단 보류' };
const SEVERITY = { MUST_FIX: '머지 전 필수', MISSING_TEST: '테스트 누락', NICE_TO_HAVE: '권장' };
// 게시 순서(publish.ts sortBySeverity)와 같게 — sort 는 안정 정렬이라 같은 심각도는 모델 순서를 지킨다.
const SEVERITY_ORDER = { MUST_FIX: 0, MISSING_TEST: 1, NICE_TO_HAVE: 2 };
const STATUS = { NOT_POSTED: '미게시', OPEN: '반응 없음', ACCEPTED: '채택', REJECTED: '기각', NEEDS_JUDGE: '판정 필요', STALE: '반응 없이 닫힘' };
const TRIGGER = { sweep: '자동', manual: '페이지', cli: 'CLI' };
const TARGET = { all: '열린 PR 전부', 'review-requested': '나에게 리뷰 요청된 PR', mine: '내가 올린 PR' };

// 리뷰 본문·PR 제목은 모델과 PR 작성자가 쓴 글이다. 화면에 넣기 전에 전부 이스케이프한다.
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (url) => (/^https:\/\/github\.com\//.test(url ?? '') ? esc(url) : '#');
const ago = (iso) => {
  if (!iso) return '';
  const s = Math.round((Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return '방금';
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  return `${Math.floor(s / 86400)}일 전`;
};
const until = (iso) => {
  if (!iso) return '멈춤';
  const s = Math.round((Date.parse(iso) - Date.now()) / 1000);
  return s <= 0 ? '곧' : s < 3600 ? `${Math.ceil(s / 60)}분 뒤` : `${Math.round(s / 3600)}시간 뒤`;
};

const toast = (message) => {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 4000);
};

const api = async (method, path, body) => {
  const response = await fetch(path, {
    method,
    headers: { 'content-type': 'application/json', 'x-review-bot': '1' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `요청 실패 (${response.status})`);
  return data;
};

const refresh = async () => {
  try {
    const response = await fetch('/api/state');
    state = await response.json();
    render();
  } catch (error) {
    document.getElementById('main').innerHTML = `<h1>서버에 연결하지 못했습니다</h1><p class="lede">터미널에서 <code>pnpm dev</code> 가 실행 중인지 확인하세요.</p>`;
  }
};

const render = () => {
  if (!state) return;
  document.querySelectorAll('nav button').forEach((button) => {
    button.setAttribute('aria-current', button.dataset.tab === tab ? 'page' : 'false');
  });
  document.getElementById('count-reviews').textContent = state.reviews.length || '';
  document.getElementById('count-judge').textContent = state.judgeQueue.length || '';
  document.getElementById('viewer').textContent = state.viewer ? `gh 계정 ${state.viewer}` : 'gh 로그인 확인 필요';
  const main = document.getElementById('main');
  if (tab === 'settings') {
    if (!settingsDraft) {
      settingsDraft = JSON.parse(JSON.stringify(state.config));
      main.innerHTML = renderSettings();
    }
    return;
  }
  settingsDraft = null;
  const scroll = window.scrollY;
  main.innerHTML = tab === 'reviews' ? renderReviews() : tab === 'learning' ? renderLearning() : renderDashboard();
  window.scrollTo(0, scroll);
};

/* ── 대시보드 ── */
const renderDashboard = () => {
  const s = state.status;
  const paused = state.config.paused;
  const repos = state.config.repos;
  const working = s.current ? `지금 ${esc(s.current)}` : '대기 중';
  const queue = s.queue.length ? `, 다음 ${s.queue.length}건 대기` : '';
  const stats = state.stats.length === 0
    ? `<div class="empty">아직 감시하는 레포가 없습니다. <a href="#settings">설정</a>에서 레포를 추가하면 ${state.config.sweepIntervalMin}분마다 열린 PR 을 찾아 리뷰합니다.</div>`
    : `<div class="table-wrap"><table>
        <thead><tr><th>레포</th><th class="num">리뷰</th><th class="num">게시한 지적</th><th class="num">채택</th><th class="num">기각</th><th class="num">판정 필요</th><th class="num">채택률</th><th>학습된 규약</th></tr></thead>
        <tbody>${state.stats.map((row) => `<tr>
          <td>${esc(row.repo)}</td>
          <td class="num">${row.reviews}</td>
          <td class="num">${row.posted}</td>
          <td class="num">${row.accepted}</td>
          <td class="num">${row.rejected}</td>
          <td class="num">${row.needsJudge ? `<span class="st NEEDS_JUDGE">${row.needsJudge}</span>` : 0}</td>
          <td class="num">${row.adoptionRate === null ? '<span class="muted">–</span>' : `${Math.round(row.adoptionRate * 100)}%`}</td>
          <td class="small">${!row.learning ? '<span class="muted">학습 꺼짐</span>' : row.learnedCategories.length ? esc(row.learnedCategories.join(', ')) : '<span class="muted">아직 없음</span>'}</td>
        </tr>`).join('')}</tbody></table></div>`;
  return `
    <h1>대시보드</h1>
    <p class="lede">감시 레포 ${repos.filter((r) => r.autoReview).length}개, 자동 게시 ${repos.filter((r) => r.publish).length}개. 다른 사람이 단 👍·👎 와 내 답글을 걷어 다음 리뷰에 반영합니다.</p>
    <div class="state-line">
      <span><span class="pulse ${paused ? 'off' : ''}"></span>${paused ? '자동 실행 멈춤' : '자동 실행 중'} · ${working}${queue}</span>
      <span class="muted small">다음 스윕 ${until(s.nextSweepAt)}, 다음 수확 ${until(s.nextHarvestAt)}</span>
      <span class="btn-row">
        <button class="btn" data-action="sweep">지금 PR 찾기</button>
        <button class="btn" data-action="harvest">지금 반응 걷기</button>
        <button class="btn ghost" data-action="pause">${paused ? '자동 실행 켜기' : '자동 실행 멈추기'}</button>
      </span>
    </div>
    <h2>레포별 현황</h2>
    ${stats}
    <h2>최근 기록</h2>
    <div class="log">${state.activity.length === 0 ? '<p class="muted">기록이 없습니다.</p>' : state.activity.slice(0, 40).map((entry) => `<div class="${entry.level}"><span class="muted">${ago(entry.at)}</span> ${esc(entry.message)}</div>`).join('')}</div>
    <p class="muted small" style="margin-top:24px">상태 파일 ${esc(state.stateFile)}</p>`;
};

/* ── 리뷰 ── */
const renderFinding = (finding) => `
  <div class="finding">
    <div><span class="mark ${finding.severity}">${SEVERITY[finding.severity] ?? esc(finding.severity)}</span>
      <span class="small muted">${esc(finding.category)}</span>
      ${finding.file ? `<span class="loc">${esc(finding.file)}${finding.line ? `:${finding.line}` : ''}</span>` : ''}</div>
    <div class="st ${finding.status}">${finding.commentUrl ? `<a href="${safeUrl(finding.commentUrl)}" target="_blank" rel="noopener">${STATUS[finding.status]}</a>` : STATUS[finding.status]}</div>
    <div class="finding-text">${esc(finding.body)}</div>
  </div>`;

const renderReview = (review) => {
  const r = review.review;
  const head = review.status === 'running' ? '<span class="muted">리뷰 중…</span>'
    : review.status === 'failed' ? '<span class="st REJECTED">실패</span>'
    : `<span class="verdict ${r.riskLevel}">위험도 ${RISK[r.riskLevel]}, ${VERDICT[r.approvalRecommendation]}</span>`;
  const extras = [
    TRIGGER[review.trigger],
    review.modelUsed,
    review.rulesUsed?.length ? `규칙 ${review.rulesUsed.join(', ')}` : null,
    review.learnedCategories?.length ? `학습 규약 ${review.learnedCategories.join(', ')}` : null,
    ago(review.createdAt),
  ].filter(Boolean).map(esc).join(' · ');
  let body = '';
  if (review.status === 'failed') {
    body = `<p class="error-text">${esc(review.error)}</p>`;
  } else if (r) {
    const publish = review.published
      ? `<p class="small">게시함 <a href="${safeUrl(review.published.url)}" target="_blank" rel="noopener">GitHub 에서 보기</a> (${ago(review.published.at)})</p>`
      : `<p class="btn-row"><button class="btn primary" data-action="publish" data-id="${esc(review.id)}">PR 에 게시</button><span class="muted small">상한 ${state.config.inlineMax}건까지, 심각도 순으로 게시합니다.</span></p>`;
    body = `
      ${r.summary ? `<blockquote class="summary-quote">${esc(r.summary)}</blockquote>` : ''}
      ${r.undeterminedReason ? `<p class="small muted">판단 보류 사유: ${esc(r.undeterminedReason)}</p>` : ''}
      ${review.truncated ? '<p class="small" style="color:var(--test)">diff 가 커서 뒷부분은 보지 못했습니다.</p>' : ''}
      ${review.findings.length ? [...review.findings].sort((a, b) => SEVERITY_ORDER[a.severity] - SEVERITY_ORDER[b.severity]).map(renderFinding).join('') : '<p class="muted">지적 사항이 없습니다.</p>'}
      ${publish}`;
  }
  return `<details class="review" data-review="${esc(review.id)}" ${openReviews.has(review.id) ? 'open' : ''}>
    <summary>
      <span class="review-title">${esc(review.repo)}#${review.number} ${esc(review.title)}</span>
      ${head}
      <span class="review-meta">${extras}</span>
    </summary>
    <div class="review-body">${body}</div>
  </details>`;
};

const renderReviews = () => `
  <h1>리뷰</h1>
  <p class="lede">자동 스윕, 이 페이지, CLI 로 돌린 리뷰가 모두 여기 쌓입니다.</p>
  <form class="inline" id="review-form">
    <label>PR 주소 또는 owner/repo#번호<input type="text" name="pr" required placeholder="owner/repo#123"></label>
    <label>모델<select name="provider"><option value="">설정값 (${esc(state.config.provider)})</option><option value="codex">codex</option><option value="claude">claude</option></select></label>
    <label class="check"><input type="checkbox" name="publish"> 바로 게시</label>
    <button class="btn primary" type="submit">리뷰 시작</button>
  </form>
  <p class="muted small" style="margin-bottom:24px">리뷰는 한 번에 하나씩 차례로 돌고, 보통 1~5분 걸립니다.</p>
  ${state.reviews.length ? state.reviews.map(renderReview).join('') : '<div class="empty">아직 리뷰가 없습니다. 위에 PR 을 넣거나 설정에서 감시할 레포를 추가하세요.</div>'}`;

/* ── 학습 ── */
const renderLearning = () => {
  const judge = state.judgeQueue.length === 0
    ? '<p class="muted">판정할 지적이 없습니다. 👍·👎 없이 답글만 달린 지적이 여기 모입니다.</p>'
    : state.judgeQueue.map((finding) => `
      <div class="judge">
        <div><span class="mark ${finding.severity}">${SEVERITY[finding.severity]}</span> <span class="small muted">${esc(finding.category)}</span>
          <span class="loc">${esc(finding.repo)}#${finding.number} ${esc(finding.file ?? '')}${finding.line ? `:${finding.line}` : ''}</span>
          ${finding.commentUrl ? `<a class="small" href="${safeUrl(finding.commentUrl)}" target="_blank" rel="noopener">스레드 열기</a>` : ''}</div>
        <p class="finding-text">${esc(finding.body)}</p>
        <div class="reply">${esc(finding.replyBody)}</div>
        <label>기각 사유 (비우면 내 답글을 사유로 씁니다. 40자 이상이어야 학습에 쓰입니다)
          <textarea data-reason="${esc(finding.id)}">${esc(finding.rejectReason ?? '')}</textarea></label>
        <p class="btn-row" style="margin-top:10px">
          <button class="btn" data-action="judge" data-decision="ACCEPTED" data-id="${esc(finding.id)}">채택</button>
          <button class="btn primary" data-action="judge" data-decision="REJECTED" data-id="${esc(finding.id)}">기각</button>
        </p>
      </div>`).join('');
  const conventions = state.stats.filter((row) => row.learning).map((row) => `
    <h3>${esc(row.repo)}</h3>
    ${row.learnedBlock ? `<pre class="block">${esc(row.learnedBlock)}</pre>` : '<p class="muted small">아직 규약이 없습니다. 같은 종류의 지적이 최근 90일 안에 두 번 이상 사유와 함께 기각되면 생깁니다.</p>'}`).join('');
  const rejected = state.rejected.length === 0
    ? '<p class="muted">기각된 지적이 없습니다.</p>'
    : `<div class="table-wrap"><table><thead><tr><th>지적</th><th>기각 사유</th><th>학습</th></tr></thead><tbody>
      ${state.rejected.map((finding) => `<tr>
        <td><span class="small muted">${esc(finding.repo)}#${finding.number} ${esc(finding.category)}</span><br>${esc(finding.body.slice(0, 160))}${finding.body.length > 160 ? '…' : ''}</td>
        <td class="small">${finding.rejectReason ? esc(finding.rejectReason.slice(0, 240)) : '<span class="muted">사유 없음 (학습 안 됨)</span>'}</td>
        <td><label class="check"><input type="checkbox" data-action="exclude" data-id="${esc(finding.id)}" ${finding.excluded ? '' : 'checked'}> 사용</label></td>
      </tr>`).join('')}</tbody></table></div>`;
  return `
    <h1>학습</h1>
    <p class="lede">게시한 지적에 👎 와 함께 남긴 내 답글이 기각 사유가 됩니다. 사유가 쌓이면 다음 리뷰부터 그 레포의 규약으로 실립니다. 보안 지적은 학습하지 않습니다.</p>
    <h2>판정 필요 ${state.judgeQueue.length ? `(${state.judgeQueue.length})` : ''}</h2>
    ${judge}
    <h2>다음 리뷰에 실릴 규약</h2>
    ${conventions || '<p class="muted">학습을 켠 레포가 없습니다.</p>'}
    <h2>기각된 지적</h2>
    <p class="muted small">잘못 굳은 규약은 여기서 "사용" 을 꺼서 빼세요.</p>
    ${rejected}`;
};

/* ── 설정 ── */
const repoCard = (repo, index) => `
  <div class="repo-card" data-index="${index}">
    <header><strong>${esc(repo.repo)}</strong><button class="btn ghost" type="button" data-action="remove-repo" data-index="${index}">삭제</button></header>
    <div class="grid2">
      <label class="check"><input type="checkbox" data-field="autoReview" ${repo.autoReview ? 'checked' : ''}> 자동으로 PR 찾아 리뷰</label>
      <label class="check"><input type="checkbox" data-field="publish" ${repo.publish ? 'checked' : ''}> 리뷰를 PR 에 바로 게시</label>
      <label class="check"><input type="checkbox" data-field="skipDrafts" ${repo.skipDrafts ? 'checked' : ''}> draft PR 건너뛰기</label>
      <label class="check"><input type="checkbox" data-field="learning" ${repo.learning ? 'checked' : ''}> 기각에서 배운 규약 싣기</label>
      <label>리뷰할 PR<select data-field="target">${Object.entries(TARGET).map(([value, label]) => `<option value="${value}" ${repo.target === value ? 'selected' : ''}>${label}</option>`).join('')}</select></label>
    </div>
    <div class="grid2" style="margin-top:12px">
      <label>규칙 문서 (기본 브랜치에서 읽음, 한 줄에 하나)<textarea data-field="rulesFiles">${esc(repo.rulesFiles.join('\n'))}</textarea></label>
      <label>직접 적는 규약 (이 레포에서 정상인 것, 지적하지 말 것)<textarea data-field="extraRules" placeholder="예: 마이그레이션 파일은 만들지 않는다. 스키마 변경은 db:push 로 끝난다.">${esc(repo.extraRules)}</textarea></label>
    </div>
  </div>`;

const renderSettings = () => {
  const c = settingsDraft;
  return `
    <h1>설정</h1>
    <p class="lede">저장하면 바로 적용됩니다. 게시를 켠 레포는 사람 확인 없이 내 gh 계정으로 코멘트를 답니다.</p>
    <form id="settings-form">
      <h2>모델과 주기</h2>
      <div class="settings-grid">
        <label>리뷰 모델<select name="provider"><option value="codex" ${c.provider === 'codex' ? 'selected' : ''}>codex (ChatGPT 구독)</option><option value="claude" ${c.provider === 'claude' ? 'selected' : ''}>claude (Claude 구독)</option></select></label>
        <label>세부 모델<input type="text" name="modelName" value="${esc(c.modelName)}" placeholder="비우면 gpt-6-sol / opus"></label>
        <label>PR 찾는 주기 (분)<input type="number" name="sweepIntervalMin" min="1" max="1440" value="${c.sweepIntervalMin}"></label>
        <label>반응 걷는 주기 (분)<input type="number" name="harvestIntervalMin" min="1" max="1440" value="${c.harvestIntervalMin}"></label>
        <label>PR 당 게시할 지적 수<input type="number" name="inlineMax" min="0" max="50" value="${c.inlineMax}"></label>
        <label>모델 제한 시간 (초)<input type="number" name="timeoutSec" min="30" max="3600" value="${c.timeoutSec}"></label>
      </div>
      <h2>감시할 레포</h2>
      <div id="repo-list">${c.repos.length ? c.repos.map(repoCard).join('') : '<div class="empty">레포를 추가하세요.</div>'}</div>
      <div class="btn-row" style="margin:8px 0 32px">
        <input type="text" id="new-repo" placeholder="owner/repo" aria-label="추가할 레포">
        <button class="btn" type="button" data-action="add-repo">레포 추가</button>
      </div>
      <div class="btn-row">
        <button class="btn primary" type="submit">설정 저장</button>
        <button class="btn ghost" type="button" data-action="reset-settings">저장한 값으로 되돌리기</button>
      </div>
    </form>`;
};

// 화면의 값을 초안에 모은다 — 레포 추가·삭제로 다시 그릴 때 입력 중인 값을 잃지 않게.
const collectSettings = () => {
  const form = document.getElementById('settings-form');
  if (!form) return;
  const data = new FormData(form);
  settingsDraft.provider = data.get('provider');
  settingsDraft.modelName = data.get('modelName');
  for (const key of ['sweepIntervalMin', 'harvestIntervalMin', 'inlineMax', 'timeoutSec']) {
    settingsDraft[key] = Number(data.get(key));
  }
  form.querySelectorAll('.repo-card').forEach((card) => {
    const repo = settingsDraft.repos[Number(card.dataset.index)];
    card.querySelectorAll('[data-field]').forEach((input) => {
      const field = input.dataset.field;
      if (input.type === 'checkbox') repo[field] = input.checked;
      else if (field === 'rulesFiles') repo[field] = input.value.split('\n').map((line) => line.trim()).filter(Boolean);
      else repo[field] = input.value;
    });
  });
};

const rerenderSettings = () => {
  document.getElementById('main').innerHTML = renderSettings();
};

/* ── 이벤트 ── */
document.querySelector('nav').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-tab]');
  if (!button) return;
  tab = button.dataset.tab;
  location.hash = tab;
  settingsDraft = null;
  render();
  document.getElementById('main').focus();
});
window.addEventListener('hashchange', () => {
  const next = location.hash.slice(1) || 'dashboard';
  if (next !== tab) { tab = next; settingsDraft = null; render(); }
});

document.getElementById('main').addEventListener('toggle', (event) => {
  const id = event.target.dataset?.review;
  if (!id) return;
  if (event.target.open) openReviews.add(id); else openReviews.delete(id);
}, true);

document.getElementById('main').addEventListener('click', async (event) => {
  const el = event.target.closest('[data-action]');
  if (!el || el.tagName === 'INPUT') return;
  const action = el.dataset.action;
  try {
    if (action === 'sweep') { const r = await api('POST', '/api/sweep'); toast(r.queued ? 'PR 찾기를 대기열에 넣었습니다.' : '이미 대기 중입니다.'); }
    if (action === 'harvest') { const r = await api('POST', '/api/harvest'); toast(r.queued ? '반응 걷기를 대기열에 넣었습니다.' : '이미 대기 중입니다.'); }
    if (action === 'pause') { await api('POST', '/api/pause', { paused: !state.config.paused }); }
    if (action === 'publish') {
      if (!confirm('이 리뷰를 PR 에 게시할까요? 내 gh 계정으로 코멘트가 달립니다.')) return;
      el.disabled = true;
      await api('POST', `/api/reviews/${el.dataset.id}/publish`);
      toast('게시를 대기열에 넣었습니다.');
    }
    if (action === 'judge') {
      const reason = document.querySelector(`textarea[data-reason="${CSS.escape(el.dataset.id)}"]`)?.value ?? '';
      await api('POST', `/api/findings/${el.dataset.id}/judge`, { decision: el.dataset.decision, reason });
      toast(el.dataset.decision === 'ACCEPTED' ? '채택으로 기록했습니다.' : '기각으로 기록했습니다.');
    }
    if (action === 'add-repo') {
      collectSettings();
      const input = document.getElementById('new-repo');
      const name = input.value.trim();
      if (!/^[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+$/.test(name)) { toast('owner/repo 형식으로 입력하세요.'); return; }
      if (settingsDraft.repos.some((repo) => repo.repo.toLowerCase() === name.toLowerCase())) { toast('이미 있는 레포입니다.'); return; }
      settingsDraft.repos.push({ repo: name, autoReview: true, publish: false, target: 'all', skipDrafts: true, learning: true, rulesFiles: ['AGENTS.md', 'CLAUDE.md', 'CODE_RULES.md', '.github/copilot-instructions.md', 'REVIEW.md'], extraRules: '' });
      rerenderSettings();
      toast(`${name} 을 추가했습니다. 저장해야 적용됩니다.`);
      return;
    }
    if (action === 'remove-repo') {
      collectSettings();
      const [removed] = settingsDraft.repos.splice(Number(el.dataset.index), 1);
      rerenderSettings();
      toast(`${removed.repo} 을 뺐습니다. 저장해야 적용됩니다.`);
      return;
    }
    if (action === 'reset-settings') {
      settingsDraft = JSON.parse(JSON.stringify(state.config));
      rerenderSettings();
      return;
    }
    await refresh();
  } catch (error) {
    toast(error.message);
    el.disabled = false;
  }
});

document.getElementById('main').addEventListener('change', async (event) => {
  const el = event.target;
  if (el.dataset.action !== 'exclude') return;
  try {
    await api('POST', `/api/findings/${el.dataset.id}/exclude`, { excluded: !el.checked });
    toast(el.checked ? '학습에 다시 씁니다.' : '학습에서 뺐습니다.');
    await refresh();
  } catch (error) { toast(error.message); }
});

document.getElementById('main').addEventListener('submit', async (event) => {
  event.preventDefault();
  try {
    if (event.target.id === 'review-form') {
      const data = new FormData(event.target);
      const publish = data.get('publish') === 'on';
      if (publish && !confirm('리뷰가 끝나면 확인 없이 PR 에 게시합니다. 진행할까요?')) return;
      const r = await api('POST', '/api/review', { pr: data.get('pr'), provider: data.get('provider') || undefined, publish });
      toast(r.queued ? '리뷰를 대기열에 넣었습니다.' : '같은 리뷰가 이미 대기 중입니다.');
      event.target.reset();
      await refresh();
    }
    if (event.target.id === 'settings-form') {
      collectSettings();
      const turningOn = settingsDraft.repos.filter((repo) => repo.publish && !state.config.repos.find((old) => old.repo === repo.repo && old.publish));
      if (turningOn.length && !confirm(`${turningOn.map((r) => r.repo).join(', ')} 은 리뷰가 끝나면 확인 없이 게시됩니다. 저장할까요?`)) return;
      await api('PUT', '/api/config', settingsDraft);
      toast('설정을 저장했습니다.');
      settingsDraft = null;
      await refresh();
    }
  } catch (error) { toast(error.message); }
});

refresh();
setInterval(() => { if (tab !== 'settings') refresh(); }, 5000);
</script>
</body>
</html>
